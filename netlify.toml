[build]
  publish = "public"

# ==============================================================================
# NETLIFY API PROXY CONFIGURATION
# ==============================================================================
# When you deploy your backend to Render, Railway, or Fly.io, replace
# the URL below with your backend URL (e.g. https://certai-api.onrender.com).
# All requests from your Netlify frontend to /api/* will be transparently
# forwarded to your backend with zero CORS issues and NO 10-second serverless timeout!
# ==============================================================================

[[redirects]]
  from = "/api/*"
  to = "https://certai-api.onrender.com/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
